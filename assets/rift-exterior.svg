<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Stylised RIFT Hotel in an Icelandic volcanic landscape at dusk">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7c858c"/><stop offset=".48" stop-color="#b7b4ac"/><stop offset=".7" stop-color="#d9cbb5"/><stop offset="1" stop-color="#6b6862"/></linearGradient>
 <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111314"/><stop offset=".55" stop-color="#353734"/><stop offset="1" stop-color="#161718"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#342a22"/><stop offset="1" stop-color="#0e1011"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffc978" stop-opacity=".95"/><stop offset="1" stop-color="#d07a32" stop-opacity="0"/></radialGradient>
 <filter id="noise"><feTurbulence baseFrequency=".8" numOctaves="4" seed="8" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
</defs>
